<div class="p-1 flex flex-wrap w-full gap-4 lg:p-4">
  @for (item of machines | categoryFilter: category(); track $index){
  <div
    class="bg-fablab-card-bg flex flex-col w-full mx-auto rounded-xl lg:min-w-[245px] lg:m-0 lg:max-w-[390px] shadow-xl"
  >
    <div class="min-w-[200px]">
      <img
        src="{{ item.imageUrl }}"
        alt="Imagen no encontrada"
        class="w-full aspect-[4/5] object-cover object-center bg-fablab-accent rounded-t-xl"
      />
    </div>
    <div class="p-2 w-full">
      <h1 class="text-[1.7rem] font-bold">{{ item.name }}</h1>
      <p class="text-[0.7rem] font-bold">{{ item.category }}</p>
      <p class="text-[0.9rem] mt-1">{{ item.description }}</p>
    </div>
    <div
      class="flex flex-col mb-2 justify-end gap-2 mr-2 h-full items-end sm:flex-row"
    >
      @if (widthWindow() >= 1024 && item.isAnimated) {
      <button
        class="px-3 py-2 rounded-lg bg-fablab-accent hover:bg-fablab-accent-dark text-black font-bold border border-fablab-primary text-fablab-primary text-xs hover:bg-fablab-primary hover:text-black transition"
        [routerLink]="['/maquinas/models', item.id]"
      >
        Tour 3D
      </button>
      }

      <button
        class="px-4 py-2 rounded-lg bg-fablab-accent text-black text-xs font-bold hover:bg-fablab-accent-dark transition shadow-sm border border-fablab-primary"
        [routerLink]="['/maquinas/item', item.id]"
      >
        Ver máquina
      </button>
    </div>
  </div>
  }
</div>
